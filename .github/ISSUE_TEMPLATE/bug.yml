name: Bug Report
description: Report a bug specific to this Web Viewer or Chromium extension
title: "[Bug]: "
body:
  - type: textarea
    attributes:
      label: Attach (recommended) or Link to PDF file
      description: Without this information the issue may be closed without comment
      placeholder: Please place only the PDF file in this field
    validations:
      required: true

  - type: markdown
    attributes: { value: "---" }

  - type: input
    attributes:
      label: Web browser and its version
      description: Please ensure that it's supported, refer to [the FAQ](https://github.com/mozilla/pdf.js/wiki/Frequently-Asked-Questions#faq-support)
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and its version
    validations:
      required: true
  - type: input
    attributes:
      label: Fork revision
      description: Include the commit hash or release tag for your build.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Does the issue also reproduce in upstream PDF.js?
      description: Try the upstream demo and report upstream issues in the Mozilla PDF.js issue tracker.
      options: ["Yes", "No", "Could not check"]
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where does the issue occur?
      options: ["Web Viewer", "Chromium extension", "Both"]
    validations:
      required: true

  - type: markdown
    attributes: { value: "---" }

  - type: textarea
    attributes:
      label: Steps to reproduce the problem
      placeholder: "1.\n2."
    validations:
      required: true

  - type: textarea
    attributes:
      label: What is the expected behavior?
      description: Also add a screenshot
    validations:
      required: true

  - type: textarea
    attributes:
      label: What went wrong?
      description: Also add a screenshot
    validations:
      required: true

  - type: input
    attributes:
      label: Link to a viewer
      description: Include the URL if the issue occurs in a hosted Web Viewer.

  - type: textarea
    attributes:
      label: Additional context
      description: Do you have anything to add that doesn't fit in the issue template?
