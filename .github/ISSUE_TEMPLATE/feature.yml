name: Feature request
description: Propose an improvement to this Web Viewer or Chromium extension
title: "[Feature]: "
body:
  - type: dropdown
    attributes:
      label: Where would the feature be used?
      options: ["Web Viewer", "Chromium extension", "Both"]
    validations:
      required: true

  - type: textarea
    attributes:
      label: Feature description
      description: What feature would you like to add? Why would it be useful? What are the current workarounds?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other PDF viewers
      description: Do other PDF viewers implement similar functionality? Add descriptions, links, and/or screenshots.
