name: Viewer CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx gulp lint

      - name: Fetch linked viewer test PDFs
        run: node test/viewer-tests.mjs fixtures

      - name: Build both targets and run viewer tests
        run: npx gulp test

      - name: Run viewer integration tests
        run: npx gulp integrationtest --filter '^(find bar|Checkbox annotation|Text widget|Simple viewer|Scripting commands (in doc_actions|requires viewer controls))'
